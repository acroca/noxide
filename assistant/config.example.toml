# config.example.toml — copy to config.toml and fill in your values

[copilot]
# Alias of the model used by default (a key of [copilot.models]).
# Switch at runtime from the app's Preferences; the choice lasts until restart.
default_model = "sonnet"
# Optional: always default to the newest model of a family instead. When set,
# the newest fetched model whose id starts with this prefix wins at startup
# and default_model is only the offline fallback.
# default_family = "claude-opus"

# Offline fallback (and pinned custom ids). The model picker itself is the
# live Copilot catalog under its own display names; entries here only show
# by alias when their id is missing from the catalog.
[copilot.models]
sonnet = "claude-sonnet-5"
# opus = "claude-opus-4.8"

# Voice transcription (optional): set ELEVENLABS_API_KEY env var to an
# ElevenLabs API key to enable the app's microphone button.

[web]
# Optional: base URL of a 4get instance (docs/deployment.md has a Compose
# service to copy). When set, the assistant gains a `research` tool that runs
# web searches in an isolated sub-agent. Leave unset to disable.
# fourget_url = "http://fourget"

[pwa]
# The web app, served by the same process. No app authentication: restrict
# access with Tailscale Serve/private networking.
# host = "127.0.0.1"
# port = 8080
# origin = "http://localhost:8080"  # exact browser origin; HTTPS outside localhost
# push_contact = "mailto:you@example.com"  # enables optional web push

[backup]
# Optional: local-only git history of the vault. Every interaction that
# changes the vault becomes one commit whose message carries the exchange;
# nothing is ever pushed anywhere. The repo lives OUTSIDE the vault (safe for
# an iCloud/Dropbox-synced vault) — by default in <state_dir>/vault.git.
# See docs/deployment.md for inspecting history and restoring.
# enabled = true
# git_dir = "/path/outside/the/vault/vault.git"

[maintenance]
# Built-in vault housekeeping (docs/vault.md): the nightly compile and the
# weekly lint. Cron expressions on your local clock, weekdays by name
# (SUN, MON, ...), never numbers. Set one to "" to disable it.
# compile = "0 3 * * *"
# lint = "0 4 * * SUN"

[assistant]
# Instance display name and assistant identity; AGENT_NAME overrides this.
# name = "Noxide"
timezone = "Europe/Madrid"
# Complete exchanges sent automatically; older archived text is retrievable on demand.
history_exchanges = 5
# Where the vault and state directories live. Defaults are relative to the
# working directory; the Docker image already points these at its own mounts,
# so only set them for a non-container run or an unusual layout.
# vault_path = "./vault"
# state_dir  = "./state"
