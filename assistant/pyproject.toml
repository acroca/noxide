[project]
name = "assistant"
version = "0.1.0"
description = "Personal assistant bot: Telegram → Copilot → markdown vault"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.0",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "dateparser>=1.2",
    "trafilatura>=2.0",
    "watchfiles>=0.21",
    "tomli>=2.0; python_version < '3.11'",
    "pypdf>=6.14.2",
    "pypdfium2>=5.12.1",
    "pillow>=12.3.0",
]

[project.scripts]
assistant = "assistant.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
